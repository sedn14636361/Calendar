<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>セットアップウィザード</title>
<style>
:root{
  --bg:#faf5e6; --panel:#fffdf6; --ink:#3c322a; --muted:#7a6f63;
  --line:#ddd2bd; --line-strong:#3c372d;
  --accent:#4285f4; --ok:#2e7d52; --ng:#c0392b; --warn:#b07d1a; --skip:#8b8378;
  --ok-bg:#e8f5ee; --ng-bg:#fdecea; --warn-bg:#fdf6e3; --skip-bg:#f2f0ec;
  --radius:10px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1c1a17; --panel:#26231f; --ink:#ece5d8; --muted:#a59b8c;
    --line:#3d382f; --line-strong:#5c5446;
    --accent:#7aa8f8; --ok:#6fcf97; --ng:#f07a6a; --warn:#e0b458; --skip:#9a9186;
    --ok-bg:#1e3328; --ng-bg:#3a221f; --warn-bg:#352c18; --skip-bg:#2b2824;
  }
}
:root[data-theme="dark"]{
  --bg:#1c1a17; --panel:#26231f; --ink:#ece5d8; --muted:#a59b8c;
  --line:#3d382f; --line-strong:#5c5446;
  --accent:#7aa8f8; --ok:#6fcf97; --ng:#f07a6a; --warn:#e0b458; --skip:#9a9186;
  --ok-bg:#1e3328; --ng-bg:#3a221f; --warn-bg:#352c18; --skip-bg:#2b2824;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  line-height:1.75; font-size:15px;
}
.wrap{max-width:860px; margin:0 auto; padding:32px 16px 80px}
h1{font-size:1.5rem; margin:0 0 4px; letter-spacing:.01em}
.sub{color:var(--muted); font-size:.9rem; margin:0}

.banner{
  margin:20px 0 14px; padding:14px 16px; background:var(--panel);
  border:1px solid var(--line); border-left:3px solid var(--accent);
  border-radius:var(--radius); font-size:.88rem;
}
.banner.limited{border-left-color:var(--warn)}
.banner b{display:block; margin-bottom:4px}
.banner ul{margin:6px 0 0; padding-left:1.2em; color:var(--muted)}
.banner code{white-space:nowrap}
.upgrade{
  margin-top:10px; padding:10px 12px; background:var(--bg);
  border:1px solid var(--line); border-radius:6px; font-size:.85rem;
}

.steps{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:24px}
.chip{
  font-size:.78rem; padding:4px 10px; border-radius:999px;
  border:1px solid var(--line); background:var(--panel); color:var(--muted);
  cursor:pointer; white-space:nowrap;
}
.chip[aria-current="true"]{border-color:var(--accent); color:var(--accent); font-weight:600}
.chip.done{border-color:var(--ok); color:var(--ok)}
.chip.fail{border-color:var(--ng); color:var(--ng)}

.card{
  background:var(--panel); border:1px solid var(--line);
  border-radius:var(--radius); padding:22px 22px 24px; margin-bottom:18px;
}
.card h2{font-size:1.12rem; margin:0 0 2px}
.card .why{color:var(--muted); font-size:.87rem; margin:0 0 16px}
ol.todo{margin:0 0 16px; padding-left:1.4em}
ol.todo li{margin-bottom:6px}
code{
  background:var(--bg); border:1px solid var(--line); border-radius:4px;
  padding:1px 5px; font-size:.86em; font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
}
a{color:var(--accent)}

figure{margin:0 0 16px}
figure img{
  display:block; max-width:100%; border:1px solid var(--line);
  border-radius:6px; background:var(--bg);
}
figcaption{font-size:.8rem; color:var(--muted); margin-top:5px}
.shot-missing{
  border:1px dashed var(--line); border-radius:6px; padding:14px;
  font-size:.82rem; color:var(--muted); background:var(--bg);
}

label{display:block; font-size:.86rem; font-weight:600; margin:14px 0 5px}
.hint{font-weight:400; color:var(--muted); font-size:.82rem}
input[type=text],input[type=password],textarea{
  width:100%; padding:9px 11px; font-size:.92rem; color:var(--ink);
  background:var(--bg); border:1px solid var(--line); border-radius:6px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
}
textarea{min-height:110px; resize:vertical; line-height:1.5}
input:focus,textarea:focus{outline:2px solid var(--accent); outline-offset:1px}
.reveal{
  background:none; border:0; color:var(--accent); font-size:.8rem;
  cursor:pointer; padding:2px 0; margin-top:4px;
}

.row{display:flex; flex-wrap:wrap; gap:9px; align-items:center; margin-top:18px}
button{
  font:inherit; font-size:.88rem; padding:8px 16px; border-radius:6px;
  border:1px solid var(--line-strong); background:var(--panel); color:var(--ink);
  cursor:pointer;
}
button.primary{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600}
button:disabled{opacity:.5; cursor:default}
button.ghost{border-color:var(--line); color:var(--muted)}
.spacer{flex:1}

.results{margin-top:16px; display:grid; gap:9px}
.res{border:1px solid var(--line); border-left-width:3px; border-radius:6px; padding:11px 13px; font-size:.88rem}
.res.ok{border-left-color:var(--ok); background:var(--ok-bg)}
.res.ng{border-left-color:var(--ng); background:var(--ng-bg)}
.res.unknown{border-left-color:var(--warn); background:var(--warn-bg)}
.res.skip{border-left-color:var(--skip); background:var(--skip-bg)}
.res .t{font-weight:600}
.res.ok .t{color:var(--ok)} .res.ng .t{color:var(--ng)}
.res.unknown .t{color:var(--warn)} .res.skip .t{color:var(--skip)}
.res .d{white-space:pre-wrap; color:var(--muted); margin-top:3px; font-size:.86rem}
.res .fixes{margin:8px 0 0; padding-left:1.15em}
.res .fixes li{margin-bottom:5px}
.res .raw{
  margin-top:8px; padding:8px 10px; background:var(--bg); border:1px solid var(--line);
  border-radius:4px; white-space:pre-wrap; font-size:.8rem;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--muted);
}
.res .step{font-size:.78rem; color:var(--muted); display:block}

.note{font-size:.84rem; color:var(--muted); margin-top:12px}
.warnbox{
  background:var(--warn-bg); border:1px solid var(--line);
  border-left:3px solid var(--warn); border-radius:6px;
  padding:11px 13px; font-size:.86rem; margin-top:14px;
}
pre.out{
  background:var(--bg); border:1px solid var(--line); border-radius:6px;
  padding:13px; overflow:auto; font-size:.8rem; max-height:280px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace; white-space:pre-wrap;
  word-break:break-all;
}
.hidden{display:none !important}
footer{text-align:center; color:var(--muted); font-size:.8rem; margin-top:32px}
.theme{position:fixed; top:12px; right:12px}
.theme button{padding:5px 10px; font-size:.78rem}
@media (max-width:600px){
  .wrap{padding:20px 16px 60px}
  .theme{position:static; text-align:right; margin-bottom:8px}
}
</style>
</head>
<body>
<div class="theme"><button id="themeBtn" type="button">表示切替</button></div>
<div class="wrap">

<header>
  <h1>セットアップウィザード</h1>
  <p class="sub">カレンダー空き日程ボット — 手順を追いながら、入力した値を確かめて進めます</p>
</header>

<div class="banner" id="modeBanner"></div>

<div class="banner">
  <b>入力した値の扱い</b>
  ここで入力する値には、Discordのトークンやサービスアカウントの秘密鍵が含まれます。
  <ul>
    <li>値はこのブラウザの外に出ません。外部に送信する処理はありません</li>
    <li>ブラウザにも保存しません。<b>ページを再読み込みすると入力は消えます</b></li>
    <li>最後に設定ファイルを保存する操作だけは、あなたが選んだときに実行されます</li>
  </ul>
</div>

<nav class="steps" id="chips"></nav>
<main id="panels"></main>

<footer>問題が起きたら <code>GUIDE.md</code> の「第III部 エラー対処」を参照してください</footer>
</div>

<script>
"use strict";

/* ===========================================================
   動作モード

   このファイルは2通りの使い方ができる。

   (A) HTMLを直接開く … 何もインストールせずに使える。
       手順の案内と、入力値の「形が正しいか」の検査、設定ファイルの
       出力ができる。ただし実際にDiscordやGoogleに接続することは
       できない。ブラウザから Discord API を呼ぶと CORS で拒否される
       ためで、これは回避できない。

   (B) python3 setup_wizard.py で開く … 同じ画面に加えて、
       実際に接続して確かめられる。トークンが通るか、INTENTがONか、
       カレンダーが読めるか。判定はボット本体と同じライブラリが行う。

   サーバー経由で開かれた場合だけ、下の KEY が実際の値に置き換わる。
   置き換わっていなければ (A) と判断する。
   =========================================================== */
const KEY = "__SETUP_KEY__";
const LIVE = !KEY.startsWith("__SETUP");

const V = {
  DISCORD_BOT_TOKEN: "", CHANNEL_ID: "",
  CALENDAR_ID: "", SERVICE_ACCOUNT_JSON: "",
};
const PROGRESS_KEY = "calbot_wizard_step";

let current = 0;
const status = {};

/* ===== 結果の形。サーバー側 setup_checks.py と同じ構造にそろえる ===== */
const R = {
  ok:(t,d)=>({status:"ok",title:t,detail:d||"",fixes:[]}),
  ng:(t,d,f)=>({status:"ng",title:t,detail:d||"",fixes:f||[]}),
  warn:(t,d,f)=>({status:"unknown",title:t,detail:d||"",fixes:f||[]}),
  skip:(t,d)=>({status:"skip",title:t,detail:d||"",fixes:[]}),
};
const GUIDE = "GUIDE.md";

/* ===========================================================
   HTML単体でもできる検査
   =========================================================== */

/* Discord の ID（snowflake）から作成日時を復元する。
   式と基準時刻は discord.py の実装から取った。
   ((id >> 22) + 1420070400000) ミリ秒 = 作成時刻 */
const DISCORD_EPOCH = 1420070400000n;
function snowflakeDate(text){
  if(!/^\d+$/.test(text)) return null;
  try{
    const ms = Number((BigInt(text) >> 22n) + DISCORD_EPOCH);
    const d = new Date(ms);
    if(isNaN(d.getTime())) return null;
    return d;
  }catch(e){ return null; }
}
function plausibleSnowflake(d){
  if(!d) return false;
  const min = new Date("2015-01-01T00:00:00Z").getTime();
  const max = Date.now() + 86400000;
  return d.getTime() >= min && d.getTime() <= max;
}
function ymd(d){
  return d.getFullYear() + "/" + (d.getMonth()+1) + "/" + d.getDate();
}

const LOCAL = {
  /* --- 鍵JSON --- */
  serviceAccount(text){
    text = (text||"").trim();
    if(!text) return R.ng("SERVICE_ACCOUNT_JSON が空です", "",
      [`鍵ファイルを開き、\`{\` から \`}\` まで全部を選択してコピーしてください（${GUIDE} 4-2）`]);

    let info;
    try{
      info = JSON.parse(text);
    }catch(e){
      /* 中身は表示しない。private_key の断片が漏れるため */
      if(!text.endsWith("}")){
        return R.ng("鍵JSONが途中で切れています",
          `末尾が \`}\` で終わっていません（全体は${text.length}文字）`,
          [`鍵ファイルの中身を、先頭の \`{\` から末尾の \`}\` まで全選択でコピーし直してください（${GUIDE} 4-2）`]);
      }
      return R.ng("鍵JSONの形式が壊れています", String(e.message || e),
        ["鍵ファイルを編集せず、そのままコピーし直してください",
         "ダウンロードした .json ファイル以外のものを貼っていないか確認してください"]);
    }
    if(typeof info !== "object" || info === null || Array.isArray(info)){
      return R.ng("鍵JSONがオブジェクト形式ではありません", "",
        ["サービスアカウントの鍵ファイル（JSON）の中身を貼ってください"]);
    }
    const need = ["type","project_id","private_key","client_email","token_uri"];
    const missing = need.filter(k => !info[k]);
    if(missing.length){
      return R.ng("鍵JSONに必要な項目がありません", "足りない項目: " + missing.join(", "),
        [`「サービスアカウント」の鍵（JSON）を作り直してください（${GUIDE} 4-2）。OAuthクライアントIDの鍵など、別種の鍵を貼っている可能性があります`]);
    }
    if(info.type !== "service_account"){
      return R.ng("サービスアカウントの鍵ではありません",
        `type が "service_account" ではなく "${info.type}" です`,
        [`認証情報の作成で「サービスアカウント」を選んで鍵を発行してください（${GUIDE} 4-2）`]);
    }
    const email = String(info.client_email);
    if(!/\.iam\.gserviceaccount\.com$/.test(email)){
      return R.warn("client_email がサービスアカウントの形式ではありません",
        `値: ${email}\n通常は \`....iam.gserviceaccount.com\` で終わります。`,
        ["別種の鍵を貼っている可能性があります。サービスアカウントの鍵か確認してください"]);
    }
    return R.ok("鍵JSONは形式として正常です",
      `client_email: ${email}\n↑ この値を、読みたいカレンダーの「設定と共有」に追加します（${GUIDE} 4-3）`);
  },

  /* --- トークン ---
     形だけで分かる問題を潰す。実際に通るかどうかは接続しないと分からない。 */
  token(text){
    const t = text || "";
    if(!t) return R.ng("トークンが空です", "",
      [`Developer Portal → Bot →「Reset Token」で表示された値を貼ってください（${GUIDE} 3-1）`]);
    if(t !== t.trim()) return R.ng("前後に空白または改行が混入しています", "",
      ["余計な文字を含めずに貼り直してください"]);
    if(/\s/.test(t)) return R.ng("トークンの途中に空白または改行が混入しています", "",
      ["改行を挟まずに、1行としてコピーし直してください"]);
    if(/^bot\s/i.test(t)) return R.ng("先頭に `Bot ` が付いています", "",
      ["トークン本体だけを貼ってください"]);

    /* トークンの先頭部分はボットのユーザーIDをbase64にしたもの。
       復元できれば「形としては辻褄が合う」と言える。
       復元できなくても誤りとは限らないので、その場合は断定しない。 */
    const seg = t.split(".")[0];
    let decoded = null;
    try{
      let b = seg.replace(/-/g,"+").replace(/_/g,"/");
      while(b.length % 4) b += "=";
      decoded = atob(b);
    }catch(e){ decoded = null; }

    if(decoded && /^\d{15,21}$/.test(decoded)){
      const d = snowflakeDate(decoded);
      if(plausibleSnowflake(d)){
        return R.ok("トークンの形に問題はありません",
          `ボットのID: ${decoded}（作成: ${ymd(d)}）\n`
          + (LIVE ? "" : "※ 実際にログインできるかは、このモードでは確認できません"));
      }
    }
    return R.warn("形からは判断できませんでした",
      "明らかな誤り（空白の混入など）は見つかりませんでしたが、"
      + "この値が実際に使えるかどうかは接続しないと分かりません。\n"
      + (LIVE ? "" : "実際に確かめるには、下の「実接続で確かめる」の手順を使ってください。"),
      ["値をもう一度 Developer Portal と照合してください"]);
  },

  /* --- チャンネルID --- */
  channelId(text){
    const t = (text||"").trim();
    if(!t) return R.ng("チャンネルIDが空です", "",
      [`開発者モードをONにし、チャンネルを右クリック→「チャンネルIDをコピー」で取得してください（${GUIDE} 3-3）`]);
    if(/^https?:/i.test(t)) return R.ng("URLが貼られています", `入力値: ${t}`,
      [`URLではなく、右クリック→「チャンネルIDをコピー」で得られる数字を貼ってください（${GUIDE} 3-3）`]);
    if(!/^\d+$/.test(t)) return R.ng("チャンネルIDが数字ではありません", `入力値: ${t}`,
      [`チャンネル名ではなく、右クリック→「チャンネルIDをコピー」で得られる数字だけを貼ってください（${GUIDE} 3-3）`]);
    if(t.length < 15 || t.length > 21) return R.ng("チャンネルIDの桁数が想定外です",
      `${t.length}桁です（通常は17〜19桁）`,
      [`右クリック→「チャンネルIDをコピー」で取得した値をそのまま貼ってください（${GUIDE} 3-3）`]);

    /* 数字の並びがDiscordのIDとして辻褄が合うかを見る。
       桁数だけの検査より強く、打ち間違いや別の数字の貼り付けを拾える。 */
    const d = snowflakeDate(t);
    if(!plausibleSnowflake(d)){
      return R.ng("DiscordのIDとして辻褄が合いません",
        d ? `この数字が示す作成日時は ${ymd(d)} で、ありえない値です。` : "",
        [`別の数字を貼っていないか確認してください`,
         `右クリック→「チャンネルIDをコピー」で取り直してください（${GUIDE} 3-3）`]);
    }
    return R.ok("チャンネルIDの形に問題はありません",
      `作成: ${ymd(d)}\n`
      + (LIVE ? "" : "※ このチャンネルが実在し、ボットから見えるかは、このモードでは確認できません"));
  },

  /* --- カレンダーID --- */
  calendars(text){
    const ids = splitCalendarIds(text);
    if(!ids.length) return [{calendar_id:"", ...R.ng("カレンダーIDが入力されていません", "",
      [`カレンダーの「設定と共有」→「カレンダーの統合」にあるIDを貼ってください（${GUIDE} 4-3）`])}];
    return ids.map(id => {
      if(/^https?:/i.test(id)) return {calendar_id:id, ...R.ng("URLが貼られています", "",
        ["カレンダーIDは `xxx@group.calendar.google.com` のような形式です"])};
      if(id !== "primary" && !id.includes("@")) return {calendar_id:id,
        ...R.warn("カレンダーIDの形式として珍しい値です",
          "通常は `xxx@group.calendar.google.com` のようにメールアドレスの形をしています。",
          [`「カレンダーの統合」にあるカレンダーIDを確認してください（${GUIDE} 4-3）`])};
      return {calendar_id:id, ...R.ok("形式に問題はありません",
        LIVE ? "" : "※ このカレンダーが読めるか（共有できているか）は、このモードでは確認できません")};
    });
  },
};

function splitCalendarIds(text){
  const out = [];
  String(text||"").split(/[,\n]/).forEach(s => {
    s = s.trim();
    if(s && out.indexOf(s) < 0) out.push(s);
  });
  return out;
}

/* ===== 設定ファイルの組み立て。ブラウザ内で作る ===== */
function buildEnvText(){
  const lines = [
    "# カレンダー空き日程ボット 環境変数",
    "# Render の Environment Variables に、Key と Value を1つずつ追加してください。",
    "# このファイルは秘密情報を含みます。共有せず、リポジトリにも入れないでください。",
    "",
  ];
  ["DISCORD_BOT_TOKEN","CHANNEL_ID","CALENDAR_ID"].forEach(n => {
    lines.push(n + "=" + (V[n] || "").trim());
  });
  let sa = (V.SERVICE_ACCOUNT_JSON || "").trim();
  try{ sa = JSON.stringify(JSON.parse(sa)); }catch(e){}   /* 壊れていてもそのまま出す */
  lines.push("SERVICE_ACCOUNT_JSON=" + sa, "",
    "# --- ローカルで動作確認するとき（1行として実行）---",
    '# DISCORD_BOT_TOKEN="..." CHANNEL_ID="..." CALENDAR_ID="..." \\',
    '#   SERVICE_ACCOUNT_JSON="$(cat service_account.json)" \\',
    "#   SSL_CERT_FILE=$(python3 -m certifi) python3 Calendar.py");
  return lines.join("\n") + "\n";
}

/* ===== サーバーへの問い合わせ（LIVE のときだけ） ===== */
async function api(path, body){
  const r = await fetch(path, {
    method:"POST",
    headers:{"Content-Type":"application/json","X-Setup-Key":KEY},
    body: JSON.stringify(body || {}),
  });
  if(!r.ok){
    let msg = "HTTP " + r.status;
    try{ const j = await r.json(); if(j.error) msg = j.error; }catch(e){}
    throw new Error(msg);
  }
  return r.json();
}

/* ===== 描画 ===== */
function esc(s){
  return String(s).replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function resultEl(res, stepLabel){
  const d = document.createElement("div");
  d.className = "res " + (res.status || "skip");
  const label = stepLabel ? `<span class="step">${esc(stepLabel)}</span>` : "";
  const mark = {ok:"OK", ng:"要対応", unknown:"判定不能", skip:"未検証"}[res.status] || "";
  let h = `${label}<span class="t">${mark}　${esc(res.title || "")}</span>`;
  if(res.detail) h += `<div class="d">${esc(res.detail)}</div>`;
  if(res.fixes && res.fixes.length){
    if(res.fixes.length > 1){
      h += `<div class="d">下の2つのどちらかですが、応答からは判別できません。両方を確認してください。</div>`;
    }
    h += "<ul class='fixes'>" + res.fixes.map(f => `<li>${esc(f)}</li>`).join("") + "</ul>";
  }
  if(res.raw) h += `<div class="raw">${esc(res.raw)}</div>`;
  d.innerHTML = h;
  return d;
}
function show(where, items){
  const box = document.getElementById(where);
  if(!box) return;
  box.innerHTML = "";
  items.forEach(([res, label]) => box.appendChild(resultEl(res, label)));
}
function worst(list){
  if(list.some(r => r.status === "ng" || r.status === "unknown")) return "fail";
  if(list.every(r => r.status === "ok")) return "done";
  return null;
}

/* 画像はこのファイルの中に埋め込んである（下の SHOTS）。
   外部ファイルを参照しないので、このHTMLを1枚だけどこに置いても、
   人に渡しても、手順の画像ごと開ける。 */
function shot(name, caption){
  const data = (typeof SHOTS !== "undefined") ? SHOTS[name] : null;
  if(!data){
    return `<div class="shot-missing">画像未設定: <code>${esc(name)}</code></div>`;
  }
  return `<figure>
    <img src="${data}" alt="${esc(caption)}" loading="lazy">
    <figcaption>${esc(caption)}</figcaption>
  </figure>`;
}

/* ===== コピーと保存 ===== */
async function copy(text, btn){
  const done = () => {
    const old = btn.textContent; btn.textContent = "コピーしました";
    setTimeout(() => { btn.textContent = old; }, 1600);
  };
  try{
    await navigator.clipboard.writeText(text);
    return done();
  }catch(e){ /* 下の方法にフォールバック */ }
  try{
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    if(ok) return done();
  }catch(e){}
  alert("コピーできませんでした。表示されている内容を選択してコピーしてください。");
}
function download(text){
  const blob = new Blob([text], {type:"text/plain;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "calendar-bot-env.txt";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* ===== 画面 ===== */
function setChip(i, state){
  if(state) status[i] = state;
  renderChips();
}
function renderChips(){
  const box = document.getElementById("chips");
  box.innerHTML = "";
  STEPS.forEach((s, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip" + (status[i] === "done" ? " done" : status[i] === "fail" ? " fail" : "");
    if(i === current) b.setAttribute("aria-current", "true");
    b.textContent = s.chip + (status[i] === "done" ? " ✓" : status[i] === "fail" ? " !" : "");
    b.onclick = () => go(i);
    box.appendChild(b);
  });
}
function go(i){
  current = Math.max(0, Math.min(STEPS.length - 1, i));
  try{ sessionStorage.setItem(PROGRESS_KEY, String(current)); }catch(e){}
  const s = STEPS[current];
  document.getElementById("panels").innerHTML = `<section class="card">
      <h2>${esc(s.title)}</h2>
      <p class="why">${esc(s.why)}</p>
      ${s.body}
      <div class="row">
        <button type="button" class="ghost" id="prevBtn"${current === 0 ? " disabled" : ""}>戻る</button>
        ${s.verify ? `<button type="button" class="primary" id="vBtn">この内容で確かめる</button>` : ""}
        <span class="spacer"></span>
        <button type="button" id="nextBtn"${current === STEPS.length - 1 ? " disabled" : ""}>次へ</button>
      </div>
    </section>`;

  setVal("in_token", V.DISCORD_BOT_TOKEN);
  setVal("in_channel", V.CHANNEL_ID);
  setVal("in_sa", V.SERVICE_ACCOUNT_JSON);
  setVal("in_cal", V.CALENDAR_ID);

  document.querySelectorAll(".reveal").forEach(b => {
    b.onclick = () => {
      const el = document.getElementById(b.dataset.for);
      const hidden = el.type === "password";
      el.type = hidden ? "text" : "password";
      b.textContent = hidden ? "隠す" : "表示する";
    };
  });

  document.getElementById("prevBtn").onclick = () => go(current - 1);
  document.getElementById("nextBtn").onclick = () => go(current + 1);
  const vb = document.getElementById("vBtn");
  if(vb){
    vb.onclick = async () => {
      vb.disabled = true; const old = vb.textContent; vb.textContent = "確認中…";
      try{
        setChip(current, await s.verify());
      }catch(err){
        const target = document.querySelector(".card .results");
        if(target){
          target.innerHTML = "";
          target.appendChild(resultEl(R.ng("確認を実行できませんでした", err.message), ""));
        }
        setChip(current, "fail");
      }
      vb.disabled = false; vb.textContent = old;
    };
  }
  if(s.onEnter) s.onEnter();
  renderChips();
  window.scrollTo({top:0, behavior:"smooth"});
}
function setVal(id, value){
  const el = document.getElementById(id);
  if(el && value) el.value = value;
}

try{
  const saved = localStorage.getItem("calbot_wizard_theme");
  if(saved) document.documentElement.setAttribute("data-theme", saved);
}catch(e){}
themeBtn.onclick = () => {

};

try{ startAt = parseInt(sessionStorage.getItem(PROGRESS_KEY) || "0", 10) || 0; }catch(e){}
go(startAt);
